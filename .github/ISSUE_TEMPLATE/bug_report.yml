name: 缺陷报告
description: 报告一个可复现的问题（安全漏洞请走私密渠道）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有同类问题。

        ⚠️ 安全漏洞请不要公开提交，请按 `SECURITY.md` 中的渠道报告。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题
          required: true
        - label: 这不是安全漏洞
          required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交号
      description: 运行 `git rev-parse --short HEAD`，或写明使用的版本
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 音频上传与波形分析
        - 时间线与选区操作
        - 播放与精确选区试听
        - 删除与撤销
        - 音频导出
        - 语音识别
        - 部署 / Docker
        - 文档
        - 其它
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      value: |
        - 部署方式：（docker compose / 本地 uvicorn）
        - Python 版本：
        - 浏览器与版本：
        - 音频格式、时长、采样率与声道数：
        - 其它：
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错时请附后端日志或浏览器控制台信息
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志等（请勿公开 API Key 或私人音频）
    validations:
      required: false
