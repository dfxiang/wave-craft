name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和 README，没有找到相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述实际使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 WaveCraft 如何解决这个问题
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 单个前端交互
        - 后端接口
        - 音频分析或导出
        - 语音识别
        - 部署与运维
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、原型或输入样例说明
    validations:
      required: false
