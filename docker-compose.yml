services:
  audio-editor:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: wavecraft-audio-editor
    init: true
    ports:
      - "${WAVECRAFT_PORT:-8000}:8000"
    environment:
      AUDIO_EDITOR_MAX_UPLOAD_MB: "250"
    volumes:
      - audio-editor-data:/data
    restart: unless-stopped

volumes:
  audio-editor-data:
